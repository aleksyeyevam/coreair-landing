<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Repair Dubai | Same Day Service</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f7f8fa;
    color: #222;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
}

/* HEADER */
header {
    background: white;
    padding: 15px 0;
    position: sticky;
    top: 0;
    border-bottom: 1px solid #eee;
}

nav {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    margin-left: 20px;
    text-decoration: none;
    color: #222;
    font-weight: 600;
}

/* HERO */
.hero {
    padding: 70px 0;
    text-align: center;
}

.hero h1 {
    font-size: 42px;
    margin-bottom: 15px;
}

.hero p {
    color: #666;
    margin-bottom: 25px;
}

.btn {
    padding: 14px 22px;
    border-radius: 8px;
    text-decoration: none;
    font-weight: bold;
    margin: 5px;
    display: inline-block;
}

.btn-call {
    background: #0d6efd;
    color: white;
}

.btn-wa {
    background: #25D366;
    color: white;
}

/* SERVICES */
.services {
    padding: 60px 0;
}

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px,1fr));
    gap: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 12px;
    transition: 0.3s;
}

.card:hover {
    transform: translateY(-5px);
}

/* FORM */
.form {
    background: white;
    padding: 30px;
    border-radius: 12px;
    margin-top: 40px;
}

input, select, textarea {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
}

button {
    width: 100%;
    padding: 14px;
    background: #0d6efd;
    color: white;
    border: none;
}

/* FLOAT BUTTON */
.whatsapp-float {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #25D366;
    color: white;
    padding: 15px 18px;
    border-radius: 50px;
    text-decoration: none;
    font-weight: bold;
}
</style>
</head>

<body>

<header>
<div class="container">
<nav>
<div><b>CoreAir</b></div>
<div>
<a href="#services">Services</a>
<a href="#form">Book</a>
</div>
</nav>
</div>
</header>

<section class="hero">
<div class="container">
<h1>AC Repair in Dubai – Same Day Service</h1>
<p>We fix, clean & install AC with no hidden charges</p>

<a href="tel:+971580000000" class="btn btn-call">Call Now</a>
<a href="https://wa.me/971580000000" class="btn btn-wa">WhatsApp</a>
</div>
</section>

<section id="services" class="services">
<div class="container">
<h2>Our Services</h2>

<div class="grid">
<div class="card">AC Repair</div>
<div class="card">AC Cleaning</div>
<div class="card">AC Maintenance</div>
<div class="card">AC Installation</div>
</div>

<div id="form" class="form">
<h3>Book Service</h3>

<form>
<input placeholder="Name">
<input placeholder="Phone">
<select>
<option>Service</option>
<option>Repair</option>
<option>Cleaning</option>
</select>
<textarea placeholder="Message"></textarea>

<button>Send Request</button>
</form>
</div>

</div>
</section>

<a href="https://wa.me/971580000000" class="whatsapp-float">
WhatsApp
</a>

</body>
</html>
