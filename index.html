<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Repair Dubai</title>

<style>
body { margin:0; font-family: Arial; background:#f4f6f9; }

h1,h2,h3,p { margin:0 0 10px; }

.container { width:90%; max-width:1000px; margin:auto; }

/* HEADER */
header { background:#fff; padding:10px 0; border-bottom:1px solid #ddd; }

nav { display:flex; justify-content:space-between; }

nav a { text-decoration:none; margin-left:10px; }

/* HERO */
.hero { padding:30px 0; text-align:center; }

/* BUTTONS */
.btn { padding:10px 15px; color:#fff; text-decoration:none; border-radius:5px; }
.call { background:#007bff; }
.wa { background:#28a745; }

/* GRID */
.grid { display:grid; grid-template-columns: repeat(2,1fr); gap:10px; }

/* CARD */
.card { background:#fff; padding:15px; border-radius:6px; }

.card:hover { background:#eee; }

/* FORM */
.form { background:#fff; padding:15px; margin-top:20px; }

input,select,textarea {
width:100%;
padding:8px;
margin-bottom:8px;
}

button {
width:100%;
padding:10px;
background:#007bff;
color:#fff;
border:none;
}
</style>
</head>

<body>

<header>
<div class="container">
<nav>
<div><b>CoreAir</b></div>
<div>
<a href="#services">Services</a>
<a href="#form">Book</a>
</div>
</nav>
</div>
</header>

<section class="hero">
<div class="container">
<h1>AC Repair Dubai</h1>
<p>Fast service. No hidden fees.</p>

<a href="tel:+971580000000" class="btn call">Call</a>
<a href="https://wa.me/971580000000" class="btn wa">WhatsApp</a>
</div>
</section>

<section id="services" class="section">
<div class="container">
<h3>Services</h3>

<div class="grid">
<div class="card">AC Repair</div>
<div class="card">AC Cleaning</div>
<div class="card">AC Maintenance</div>
<div class="card">AC Installation</div>
</div>

</div>
</section>

<section id="form" class="section">
<div class="container">

<div class="form">
<h3>Book Service</h3>

<form>
<input type="text" placeholder="Name" required>
<input type="tel" placeholder="Phone" required>

<select required>
<option value="">Select service</option>
<option>AC Repair</option>
<option>AC Cleaning</option>
<option>AC Maintenance</option>
<option>AC Installation</option>
</select>

<textarea placeholder="Message"></textarea>

<button type="submit">Send</button>
</form>
</div>

</div>
</section>

<a href="https://wa.me/971580000000" class="float">WhatsApp</a>

</body>
</html>
