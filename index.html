<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AC Repair Dubai</title>

<style>
body {
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f6f9;
    color:#111;
}

.container {
    width:90%;
    max-width:1000px;
    margin:auto;
}

/* HEADER */
header {
    background:#fff;
    padding:10px 0;
    border-bottom:1px solid #eee;
}

nav {
    display:flex;
    justify-content:space-between;
    align-items:center;
}

nav a {
    margin-left:15px;
    text-decoration:none;
    color:#111;
    font-size:14px;
}

/* HERO */
.hero {
    padding:40px 0;
    text-align:center;
}

.hero h1 {
    font-size:32px;
    margin-bottom:10px;
}

.hero p {
    font-size:14px;
    color:#555;
    margin-bottom:20px;
}

.btn {
    padding:10px 16px;
    border-radius:6px;
    text-decoration:none;
    color:#fff;
    font-size:14px;
}

.call { background:#0d6efd; }
.wa { background:#25D366; }

/* SERVICES */
.section {
    padding:30px 0;
}

.grid {
    display:grid;
    grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
    gap:15px;
}

.card {
    background:#fff;
    padding:18px;
    border-radius:8px;
    font-size:14px;
}

/* FORM */
.form {
    background:#fff;
    padding:20px;
    border-radius:8px;
}

input, select, textarea {
    width:100%;
    padding:10px;
    margin-bottom:8px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:14px;
}

button {
    width:100%;
    padding:12px;
    background:#0d6efd;
    color:#fff;
    border:none;
    border-radius:6px;
}

/* FLOAT */
.float {
    position:fixed;
    bottom:15px;
    right:15px;
    background:#25D366;
    color:#fff;
    padding:10px 14px;
    border-radius:40px;
    text-decoration:none;
    font-size:14px;
}
</style>
</head>

<body>

<header>
<div class="container">
<nav>
<div><b>CoreAir</b></div>
<div>
<a href="#services">Services</a>
<a href="#form">Book</a>
</div>
</nav>
</div>
</header>

<section class="hero">
<div class="container">
<h1>AC Repair Dubai</h1>
<p>Fast service. No hidden fees.</p>

<a href="tel:+971580000000" class="btn call">Call</a>
<a href="https://wa.me/971580000000" class="btn wa">WhatsApp</a>
</div>
</section>

<section id="services" class="section">
<div class="container">
<h3>Services</h3>

<div class="grid">
<div class="card">AC Repair</div>
<div class="card">AC Cleaning</div>
<div class="card">AC Maintenance</div>
<div class="card">AC Installation</div>
</div>

</div>
</section>

<section id="form" class="section">
<div class="container">

<div class="form">
<h3>Book Service</h3>

<form>
<input type="text" placeholder="Name" required>
<input type="tel" placeholder="Phone" required>

<select required>
<option value="">Select service</option>
<option>AC Repair</option>
<option>AC Cleaning</option>
<option>AC Maintenance</option>
<option>AC Installation</option>
</select>

<textarea placeholder="Message"></textarea>

<button type="submit">Send</button>
</form>
</div>

</div>
</section>

<a href="https://wa.me/971580000000" class="float">WhatsApp</a>

</body>
</html>
